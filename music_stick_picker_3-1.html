<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3rd Period Music • Stick Picker</title><style>:root{font-family:system-ui,Segoe UI,sans-serif;color:#f3f5ff;background:#0c1025}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#263061,#0c1025 70%)}main{max-width:980px;margin:auto;padding:26px 18px;text-align:center}h1{margin:0;color:#6cf9ed;font-size:clamp(28px,5vw,44px)}.sub{color:#c7c7f6;margin:6px 0 22px}.stage{height:420px;position:relative;overflow:hidden;border:1px solid #55538a;border-radius:22px;background:radial-gradient(circle at 50% 35%,#303b75,#151b39 75%)}.can{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:240px;height:205px;background:linear-gradient(90deg,#575b86,#b4b9e4 30%,#555c96 70%,#30375f);border-radius:16px 16px 55px 55px;box-shadow:0 20px 40px #05071899;z-index:3;display:grid;place-items:center}.can:before{content:"";position:absolute;top:-16px;left:-4px;width:248px;height:37px;border-radius:50%;background:#232846;border:9px solid #a7b0dc}.can b{font-size:27px;color:#c6ff5a;text-shadow:0 2px 8px #15192e;line-height:1.2}.sticks{position:absolute;left:50%;bottom:210px;width:300px;height:180px;transform:translateX(-50%);z-index:2}.stick{position:absolute;bottom:-25px;left:50%;width:19px;height:175px;border-radius:9px 9px 3px 3px;background:linear-gradient(90deg,#b9834c,#f2cb8d 40%,#c78c50);transform-origin:bottom center;box-shadow:1px 1px 4px #0008}.stick:after{content:"";position:absolute;top:12px;left:4px;width:10px;height:65px;background:#fff9;border-radius:3px}.chosen{position:absolute;left:50%;bottom:205px;z-index:4;width:28px;height:180px;background:linear-gradient(90deg,#bb8248,#f6d399,#b87c3c);border-radius:13px 13px 4px 4px;transform:translateX(-50%) translateY(170px);opacity:0;display:flex;justify-content:center;align-items:flex-start;box-shadow:0 0 18px #c5ff6299}.chosen span{position:absolute;top:28px;background:#fff;color:#17213a;padding:8px 12px;border-radius:6px;white-space:nowrap;font-weight:800;font-size:20px;box-shadow:0 2px 8px #0007}.chosen.up{animation:pull 1.7s cubic-bezier(.16,.8,.18,1) forwards}@keyframes pull{0%{opacity:1;transform:translateX(-50%) translateY(170px) rotate(0)}60%{opacity:1;transform:translateX(-50%) translateY(-80px) rotate(-5deg)}100%{opacity:1;transform:translateX(-50%) translateY(-110px) rotate(0)}}.result{font-size:24px;font-weight:800;min-height:36px;margin:18px;color:#d6ff77}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}button,select{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:750}button{background:#65f7e7;color:#10152b;cursor:pointer}button.secondary{background:#383d69;color:white}button:disabled{opacity:.5;cursor:default}.panel{margin:24px auto;max-width:680px;background:#1a2144;border:1px solid #444d86;padding:18px;border-radius:16px;text-align:left}.panel h2{font-size:17px;margin:0 0 12px}textarea{width:100%;height:120px;resize:vertical;border-radius:10px;background:#0e1430;border:1px solid #525d91;color:white;padding:12px;font:inherit}.settings{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0;color:#e5e6ff}.count{color:#bac4ec;font-size:14px;margin-top:10px}select{background:#303962;color:white}.confetti{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}.bit{position:absolute;top:-20px;width:9px;height:15px;animation:fall 2.4s linear forwards}@keyframes fall{to{transform:translateY(470px) rotate(700deg);opacity:0}}@media(max-width:600px){.stage{height:390px}.can{bottom:28px}.sticks{bottom:204px}.chosen{bottom:199px}}</style></head><body><main><h1>🦉 Stick Picker</h1><p class="sub">3rd Period Music • Pick a name from the can!</p><div class="stage"><div class="sticks" id="sticks"></div><div class="chosen" id="chosen"><span id="stickName"></span></div><div class="can"><b>3RD PERIOD<br>🎵 MUSIC</b></div><div class="confetti" id="confetti"></div></div><div class="result" id="result" aria-live="polite">Who's getting picked?</div><div class="controls"><button id="pick">🥢 Pull a Stick!</button><button class="secondary" id="reset">↺ Reset Everyone</button></div><div class="panel"><h2>Class List</h2><div class="settings"><label><input type="checkbox" id="remove" checked> Remove selected names until reset</label></div><textarea id="names" aria-label="Student names, one per line"></textarea><div class="controls" style="justify-content:flex-start;margin-top:10px"><button id="apply">Update Names</button></div><div class="count" id="count"></div></div></main><script>const initial=`Isaiah\nChris\nDayton\nDaniel\nKole\nColin\nAngel\nGabriel\nThatcher\nTrevor\nKeastin\nScarlett\nSam\nCarlee J.\nElliana\nWilliam\nHutch\nHouston\nEnayah\nSky\nCarlee V.\nRissa\nArcher`;let all=initial.split('\n'),pool=[...all],busy=false;const $=id=>document.getElementById(id);$('names').value=initial;function render(){const holder=$('sticks');holder.innerHTML='';const n=Math.min(pool.length,17);for(let i=0;i<n;i++){const el=document.createElement('div');el.className='stick';const angle=(i-(n-1)/2)*5.3;el.style.transform=`translateX(-50%) rotate(${angle}deg)`;el.style.height=(150+(i%4)*8)+'px';holder.appendChild(el)}$('count').textContent=`${pool.length} of ${all.length} names available`;$('pick').disabled=busy||!pool.length}function confetti(){const box=$('confetti');box.innerHTML='';for(let i=0;i<48;i++){let el=document.createElement('i');el.className='bit';el.style.left=Math.random()*100+'%';el.style.background=['#65f7e7','#c4ff58','#ac83ff','#ff81cf'][i%4];el.style.animationDelay=Math.random()*.65+'s';box.appendChild(el)}setTimeout(()=>box.innerHTML='',3200)}$('pick').onclick=()=>{if(busy||!pool.length)return;busy=true;render();$('result').textContent='Reaching into the can…';$('chosen').classList.remove('up');void $('chosen').offsetWidth;const index=Math.floor(Math.random()*pool.length),name=pool[index];$('stickName').textContent=name;$('chosen').classList.add('up');setTimeout(()=>{$('result').textContent=`🎉 ${name}!`;confetti();if($('remove').checked)pool.splice(index,1);busy=false;render()},1750)};$('reset').onclick=()=>{if(busy)return;pool=[...all];$('chosen').classList.remove('up');$('result').textContent="Who's getting picked?";render()};$('apply').onclick=()=>{if(busy)return;all=$('names').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);pool=[...all];$('chosen').classList.remove('up');$('result').textContent='Names updated!';render()};render();</script></body></html>
